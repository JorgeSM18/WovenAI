<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .camera-shutter-outer {
            border: 4px solid white;
            padding: 4px;
            border-radius: 50%;
        }
        .camera-shutter-inner {
            background-color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
        }
        .scanning-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            animation: scan 2s linear infinite;
            position: absolute;
            width: 100%;
            z-index: 20;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .mask-animate {
            mask-image: linear-gradient(to bottom, black var(--p), transparent var(--p));
            transition: --p 2s ease-out;
        }
        @property --p {
            syntax: '<percentage>';
            inherits: false;
            initial-value: 100%;
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .hidden-stage {
            display: none !important;
        }

<script>
        const shutterBtn = document.getElementById('shutter-btn');
        const cameraStage = document.getElementById('camera-stage');
        const processingStage = document.getElementById('processing-stage');
        const reviewStage = document.getElementById('review-stage');
        const globalNav = document.getElementById('global-nav');
        const maskedImage = document.getElementById('masked-image');

        shutterBtn.addEventListener('click', () => {
            // Shutter sound/flash effect
            cameraStage.classList.add('opacity-0');
            setTimeout(() => {
                cameraStage.classList.add('hidden-stage');
                processingStage.classList.remove('hidden-stage');
                
                // Simulate AI Masking
                setTimeout(() => {
                    maskedImage.style.setProperty('--p', '0%');
                }, 100);

                // Move to Review Stage
                setTimeout(() => {
                    processingStage.classList.add('opacity-0');
                    setTimeout(() => {
                        processingStage.classList.add('hidden-stage');
                        reviewStage.classList.remove('hidden-stage');
                        globalNav.classList.remove('hidden-stage');
                        reviewStage.classList.add('animate-in', 'fade-in', 'slide-in-from-bottom-8', 'duration-700');
                    }, 300);
                }, 3000);
            }, 300);
        });

        function resetCapture() {
            location.reload(); // Simple reset for demo
        }

        // Add visual micro-interaction for adding item
        document.getElementById('add-btn').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                this.classList.replace('bg-primary', 'bg-green-600');
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Added';
            }, 1000);
        });
    </script>
<style>
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s infinite ease-in-out;
        }
        .fade-in { opacity: 0; animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .slide-in-from-bottom-8 { transform: translateY(2rem); animation: slideIn 0.8s forwards; }
        @keyframes slideIn { to { transform: translateY(0); } }
    </style>
