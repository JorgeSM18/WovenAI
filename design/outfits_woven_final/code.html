<script>
        // Simple Drag Interaction Mockup
        const items = document.querySelectorAll('.canvas-item');
        items.forEach(item => {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;

            item.addEventListener('touchstart', dragStart, false);
            item.addEventListener('touchend', dragEnd, false);
            item.addEventListener('touchmove', drag, false);

            function dragStart(e) {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
                if (e.target === item || item.contains(e.target)) {
                    isDragging = true;
                    item.style.zIndex = "100";
                }
            }

            function dragEnd() {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                item.style.zIndex = "50";
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                    xOffset = currentX;
                    yOffset = currentY;
                    setTranslate(currentX, currentY, item);
                }
            }

            function setTranslate(xPos, yPos, el) {
                const currentRotation = el.style.transform.match(/rotate\(([^)]+)\)/) ? el.style.transform.match(/rotate\(([^)]+)\)/)[0] : 'rotate(0deg)';
                el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0) ${currentRotation}`;
            }
        });

        // Tray Toggle Logic
        let trayOpen = false;
        function toggleTray() {
            const tray = document.getElementById('wardrobe-tray');
            if (trayOpen) {
                tray.style.transform = 'translateY(calc(100% - 80px))';
            } else {
                tray.style.transform = 'translateY(0)';
            }
            trayOpen = !trayOpen;
        }

        // Tactile Haptic Simulation (Visual only)
        document.querySelectorAll('button, .canvas-item').forEach(el => {
            el.addEventListener('click', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(10);
                }
            });
        });
